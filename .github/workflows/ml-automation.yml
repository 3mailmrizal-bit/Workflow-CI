name: CI-MLflow-Workflow-Docker

on:
  push:
    branches: [ main ]

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MLflow
        run: pip install mlflow

      # ✅ PERBAIKAN: Gunakan mlflow run sesuai struktur folder
      - name: Run MLflow Project (Training)
        run: |
          mlflow run MLProject \
            --experiment-name "Workflow_CI_Experiment" \
            --env-manager local \
            -P n_estimators=100 \
            -P max_depth=10

      - name: Upload Model Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-hasil-training
          path: mlruns/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker Image
        run: |
          MODEL_PATH=$(find . -name "MLmodel" -exec dirname {} \; | head -n 1)
          echo "Model path ditemukan di: $MODEL_PATH"
          
          if [ -z "$MODEL_PATH" ]; then
            echo "Error: Model tidak ditemukan!"
            exit 1
          fi
          
          mlflow models build-docker -m "$MODEL_PATH" -n "${{ secrets.DOCKER_USER }}/msml-model:latest"

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USER }}/msml-model:latest